name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, CLI and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The CLI targets net10.0; the libraries and the Example/test project target net8.0.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # ShadowDusk's native DXC / vkd3d-shader libraries are not in the repository.
      # They must be restored BEFORE building so the build copies them next to the CLI
      # (the mgfx / kni / fna targets need them).
      - name: Restore ShadowDusk natives
        run: bash ThirdParty/ShadowDusk/tools/restore.sh

      - name: Restore
        run: dotnet restore Examples/YotsubaShader.Example/YotsubaShader.Example.csproj

      # The Example project's post-build step also runs the CLI (`add`); it is
      # disabled here so the CLI is exercised explicitly in the next steps.
      - name: Build
        run: dotnet build Examples/YotsubaShader.Example/YotsubaShader.Example.csproj --configuration Release --no-restore -p:CompileYotsubaShaders=false

      - name: Build CLI
        run: dotnet build Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj --configuration Release

      - name: Run CLI against the example (compile)
        run: >
          dotnet run --project Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj --configuration Release --no-build --
          compile Examples/YotsubaShader.Example/YotsubaShader.Example.csproj
          --target spirv --target hlsl --target glsl --target gles --target msl --target cpp
          --output "$RUNNER_TEMP/compiled-shaders"

      - name: Verify CLI produced output
        run: |
          count=$(find "$RUNNER_TEMP/compiled-shaders" -type f | wc -l)
          echo "CLI generated $count file(s)"
          test "$count" -gt 0

      - name: Run CLI against the example (add)
        run: >
          dotnet run --project Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj --configuration Release --no-build --
          add Examples/YotsubaShader.Example/YotsubaShader.Example.csproj
          --target spirv --target hlsl --target glsl --target gles --target msl --target cpp
          --output "$RUNNER_TEMP/compiled-shaders-add"

      - name: Test
        run: dotnet test Examples/YotsubaShader.Example/YotsubaShader.Example.csproj --configuration Release --no-restore -p:CompileYotsubaShaders=false --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      - name: Build every Extensions project
        run: |
          for project in Plugins/YotsubaShader.Extensions*/YotsubaShader.Extensions*.csproj; do
            dotnet build "$project" --configuration Release
          done

      - name: Pack NuGet libraries, analyzer and tool
        run: bash scripts/pack_release.sh 0.1.0 "$RUNNER_TEMP/nupkg"

      - name: Verify package graph and analyzer layout
        run: python3 scripts/verify_release.py packages "$RUNNER_TEMP/nupkg" 0.1.0 --skip-native-check

      - name: Install libraries and analyzer in a clean consumer
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/Consumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="YotsubaShader.GlslSyntax" Version="0.1.0" />
              <PackageReference Include="YotsubaShader.HlslSyntax" Version="0.1.0" />
              <PackageReference Include="YotsubaShader.MslSyntax" Version="0.1.0" />
              <PackageReference Include="YotsubaShader.SpirvSyntax" Version="0.1.0" />
              <PackageReference Include="YotsubaShader.WgslSyntax" Version="0.1.0" />
              <PackageReference Include="YotsubaShader.Compiler.Library" Version="0.1.0" />
              <PackageReference Include="YotsubaShader.IDE.Analyzer" Version="0.1.0" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          echo 'public class Consumer {}' > "$RUNNER_TEMP/consumer/Consumer.cs"
          dotnet restore "$RUNNER_TEMP/consumer/Consumer.csproj" \
            --source "$RUNNER_TEMP/nupkg" --source https://api.nuget.org/v3/index.json
          dotnet build "$RUNNER_TEMP/consumer/Consumer.csproj" -c Release --no-restore
          dotnet msbuild "$RUNNER_TEMP/consumer/Consumer.csproj" -target:ResolveReferences -getItem:Analyzer \
            | grep -F 'analyzers/dotnet/cs/YotsubaShader.IDE.Analyzer.dll'

      - name: Install and smoke the packed dotnet tool
        run: |
          dotnet tool install YotsubaShader.Compiler.CLI --tool-path "$RUNNER_TEMP/yotsuba-tool" \
            --add-source "$RUNNER_TEMP/nupkg" --version 0.1.0
          python3 scripts/verify_release.py smoke "$RUNNER_TEMP/yotsuba-tool/yotsuba" \
            Examples/YotsubaShader.Example/YotsubaShader.Example.csproj

      # Load tests: each compiles a HLSL shader to the engine's effect format, loads it as a
      # real Effect and renders a triangle (software OpenGL under Xvfb). Verified on linux-x64.
      # FNA needs native SDL3 and FNA3D, which are not packaged for Ubuntu: they are built
      # from source once and cached.
      - name: Install Xvfb and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1 libsdl2-2.0-0

      - name: Build MonoGame example
        run: dotnet build Examples/MonoGame.LoadTest/MonoGame.LoadTest.csproj --configuration Release

      - name: Run MonoGame example (load MGFX)
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet run --no-build --configuration Release --project Examples/MonoGame.LoadTest/MonoGame.LoadTest.csproj

      - name: Build KNI example
        run: dotnet build Examples/KNI.LoadTest/KNI.LoadTest.csproj --configuration Release

      - name: Run KNI example (load effect)
        run: xvfb-run -a -s "-screen 0 1280x720x24" dotnet run --no-build --configuration Release --project Examples/KNI.LoadTest/KNI.LoadTest.csproj

      - name: Cache FNA native libraries
        id: fnalibs
        uses: actions/cache@v4
        with:
          path: ~/fnalibs
          key: fnalibs-linux-x64-sdl-3.2.22-fna3d-v1

      - name: Build FNA native libraries (SDL3, FNA3D)
        if: steps.fnalibs.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential pkg-config \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxfixes-dev libxtst-dev \
            libgl-dev libegl-dev libdrm-dev libgbm-dev libasound2-dev libudev-dev
          curl -sSL -o "$RUNNER_TEMP/sdl3.tgz" https://github.com/libsdl-org/SDL/releases/download/release-3.2.22/SDL3-3.2.22.tar.gz
          tar -xzf "$RUNNER_TEMP/sdl3.tgz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-3.2.22" -B "$RUNNER_TEMP/sdl3-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl3-build"
          cmake --install "$RUNNER_TEMP/sdl3-build" --prefix "$HOME/fnalibs"
          git clone --recursive --depth 1 https://github.com/FNA-XNA/FNA3D.git "$RUNNER_TEMP/FNA3D"
          cmake -S "$RUNNER_TEMP/FNA3D" -B "$RUNNER_TEMP/fna3d-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SDL3=ON -DCMAKE_PREFIX_PATH="$HOME/fnalibs"
          cmake --build "$RUNNER_TEMP/fna3d-build"
          cp -a "$RUNNER_TEMP"/fna3d-build/libFNA3D.so* "$HOME/fnalibs/lib/"

      - name: Build FNA example
        run: dotnet build Examples/FNA.LoadTest/FNA.LoadTest.csproj --configuration Release

      - name: Run FNA example (load effect)
        run: LD_LIBRARY_PATH="$HOME/fnalibs/lib" xvfb-run -a -s "-screen 0 1280x720x24" dotnet run --no-build --configuration Release --project Examples/FNA.LoadTest/FNA.LoadTest.csproj

      - name: Upload compiled shaders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-shaders
          path: ${{ runner.temp }}/compiled-shaders
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

  platform-smoke:
    name: Self-contained CLI ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2022}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore native dependencies on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash ThirdParty/ShadowDusk/tools/restore.sh
      - name: Restore native dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ThirdParty/ShadowDusk/tools/restore.ps1
      - name: Publish and run outside checkout
        shell: bash
        run: |
          dotnet build Examples/YotsubaShader.Example/YotsubaShader.Example.csproj \
            -c Release -p:CompileYotsubaShaders=false
          dotnet publish Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj \
            -c Release -r '${{ matrix.rid }}' --self-contained \
            -p:RestoreLockedMode=false -o 'publish/${{ matrix.rid }}'
          mkdir -p "$RUNNER_TEMP/yotsuba-${{ matrix.rid }}"
          cp -R 'publish/${{ matrix.rid }}/.' "$RUNNER_TEMP/yotsuba-${{ matrix.rid }}/"
          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            exe="$RUNNER_TEMP/yotsuba-${{ matrix.rid }}/YotsubaShader.Compiler.CLI.exe"
          else
            exe="$RUNNER_TEMP/yotsuba-${{ matrix.rid }}/YotsubaShader.Compiler.CLI"
            chmod +x "$exe"
          fi
          python scripts/verify_release.py smoke "$exe" Examples/YotsubaShader.Example/YotsubaShader.Example.csproj

  plugin-smoke:
    name: FNA, MonoGame and KNI plugins ${{ matrix.rid }}
    # Compiles a shader to every plugin target with the plugins built from this commit, on each platform
    # the CLI ships for. FNA and DirectX 11 use vkd3d-shader; OpenGL, Vulkan, DirectX 12, iOS and Android
    # use the pinned DXC. Linux ARM64 and Windows ARM64 only get checked here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2022}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore native dependencies on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash ThirdParty/ShadowDusk/tools/restore.sh
      - name: Restore native dependencies on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ThirdParty/ShadowDusk/tools/restore.ps1
      - name: Publish the CLI for ${{ matrix.rid }}
        shell: bash
        run: |
          dotnet publish Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj \
            -c Release -r '${{ matrix.rid }}' --self-contained \
            -p:RestoreLockedMode=false -o 'publish/${{ matrix.rid }}'
      - name: Build the smoke shader project (the CLI reads the referenced projects' builds)
        shell: bash
        run: dotnet build scripts/smoke/PluginSmoke/PluginSmoke.csproj -c Release -p:CompileYotsubaShaders=false
      - name: Stage the plugins of this commit
        shell: bash
        run: python scripts/stage_plugins.py "$RUNNER_TEMP/yotsuba-home" fna monogame kni
      - name: Compile for every plugin target
        shell: bash
        env:
          YOTSUBA_HOME: ${{ runner.temp }}/yotsuba-home
          YOTSUBA_SMOKE_PLUGINS: fna,monogame,kni
        run: |
          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            exe="$PWD/publish/${{ matrix.rid }}/YotsubaShader.Compiler.CLI.exe"
          else
            exe="$PWD/publish/${{ matrix.rid }}/YotsubaShader.Compiler.CLI"
            chmod +x "$exe"
          fi
          python scripts/verify_release.py smoke "$exe" scripts/smoke/PluginSmoke/PluginSmoke.csproj

  api-conformance:
    name: Graphics API conformance (${{ matrix.name }})
    # Every `Target` has a profile (Core/Analyzers/YotsubaShader.IDE.Analyzer/GraphicsApi). This compiles one tiny
    # shader per feature at each API's language version and runs the real validator, so what the analyzer says each
    # API version has or lacks is checked against spirv-val, glslang, naga, DXC and the Metal compiler.
    # A feature that must work and fails is an error; one that must fail and passes is an error where the validator
    # is strict and only a warning where the language has extension fallbacks or no validator exists here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Vulkan OpenGL WebGPU Direct3D, os: ubuntu-24.04, only: 'Vulkan,OpenGL,OpenGLES,DirectX,WebGpu'}
          - {name: Metal, os: macos-15, only: 'Metal'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore ShadowDusk natives
        run: bash ThirdParty/ShadowDusk/tools/restore.sh
      - name: Install SPIR-V and GLSL validators
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools glslang-tools
      - name: Cache naga
        if: runner.os == 'Linux'
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.1-${{ runner.os }}
      - name: Install naga (WGSL validator)
        if: runner.os == 'Linux' && steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.1 --locked
      - name: Build the naga native (the CLI needs it for --target wgsl)
        if: runner.os == 'Linux'
        # The natives are not committed; naga-native.yml builds one per RID. The macOS job does not generate WGSL.
        run: bash Core/YotsubaShader.Compiler.CLI/Native/naga/build.sh linux-x64
      - name: Install the Metal toolchain
        if: runner.os == 'macOS'
        # Without it the script reports the Metal results as unverified (warnings) instead of failing.
        run: sudo xcodebuild -downloadComponent MetalToolchain || echo "::warning::Metal toolchain unavailable"
      - name: Build the CLI
        run: dotnet build Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj
      - name: Build the witness shaders
        run: dotnet build scripts/conformance/ApiConformance/ApiConformance.csproj
      - name: Export what each profile promises
        env:
          YOTSUBA_API_MATRIX: ${{ runner.temp }}/api-matrix.json
        run: dotnet test Core/Analyzers/YotsubaShader.IDE.Analyzer.Tests --filter Export_the_matrix
      - name: Compare with the real validators
        run: >
          python3 scripts/api_conformance.py
          Core/YotsubaShader.Compiler.CLI/bin/Debug/net10.0/YotsubaShader.Compiler.CLI
          "$RUNNER_TEMP/api-matrix.json" --only '${{ matrix.only }}'
