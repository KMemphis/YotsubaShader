name: Publish NuGet and CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub Release tag to retry
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
          fetch-depth: 0
      - name: Validate stable tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', tag):
              raise SystemExit(f'Expected stable vX.Y.Z tag, got {tag!r}')
          props = ET.parse('Directory.Build.props').getroot()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={tag[1:]}\n')
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .prerelease)" = false
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  naga:
    needs: validate
    uses: ./.github/workflows/naga-native.yml

  pack:
    needs: [validate, naga]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: naga-*
          path: Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes-download
      - name: Place naga natives under runtimes/<rid>/native
        shell: bash
        run: |
          for dir in Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes-download/naga-*; do
            rid="${dir##*/naga-}"
            mkdir -p "Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes/$rid/native"
            cp "$dir"/* "Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes/$rid/native/"
          done
      - name: Datos del MCP (referencia de learn y ejemplos)
        uses: ./.github/actions/mcp-data
        with:
          token: ${{ secrets.WEB_REPO_TOKEN }}

      - name: Build and test
        run: |
          bash ThirdParty/ShadowDusk/tools/restore.sh
          dotnet build Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj -c Release
          dotnet test Examples/YotsubaShader.Example/YotsubaShader.Example.csproj -c Release -p:CompileYotsubaShaders=false
          dotnet test Core/YotsubaShader.Mcp.Tests/YotsubaShader.Mcp.Tests.csproj -c Release
      - name: Pack every public and support package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/pack_release.sh "$VERSION" nupkg
      - name: Verify all package contents and six native sets
        run: python3 scripts/verify_release.py packages nupkg '${{ needs.validate.outputs.version }}'
      - name: Install packages in a clean consumer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/Consumer.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="YotsubaShader.Concepts" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.Language" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.GlslSyntax" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.HlslSyntax" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.MslSyntax" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.SpirvSyntax" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.WgslSyntax" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.Compiler.Library" Version="$VERSION" />
              <PackageReference Include="YotsubaShader.IDE.Analyzer" Version="$VERSION" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF
          # Metadata no está en la lista de arriba: llega como dependencia de las sintaxis.
          cat > "$RUNNER_TEMP/consumer/Consumer.cs" <<'EOF'
          using YotsubaShader.Compiler.Metadata;
          [ShaderTargets(Target.Vulkan_13 | Target.WebGpu)]
          [ShaderEngines(GameEngine.Godot)]
          public class Consumer {}
          EOF
          dotnet restore "$RUNNER_TEMP/consumer/Consumer.csproj" --source "$PWD/nupkg" --source https://api.nuget.org/v3/index.json
          dotnet build "$RUNNER_TEMP/consumer/Consumer.csproj" -c Release --no-restore
          dotnet msbuild "$RUNNER_TEMP/consumer/Consumer.csproj" -target:ResolveReferences -getItem:Analyzer \
            | grep -F 'analyzers/dotnet/cs/YotsubaShader.IDE.Analyzer.dll'
          dotnet tool install YotsubaShader.Compiler.CLI --tool-path "$RUNNER_TEMP/tool" --add-source "$PWD/nupkg" --version "$VERSION"
          test -x "$RUNNER_TEMP/tool/yotsuba"
          python3 scripts/verify_release.py smoke "$RUNNER_TEMP/tool/yotsuba" Examples/YotsubaShader.Example/YotsubaShader.Example.csproj
          python3 scripts/mcp_smoke.py "$RUNNER_TEMP/tool/yotsuba" mcp
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
          if-no-files-found: error

  publish-cli:
    needs: [validate, pack, naga]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2022}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: naga-*
          path: Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes-download
      - name: Place naga natives under runtimes/<rid>/native
        shell: bash
        run: |
          for dir in Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes-download/naga-*; do
            rid="${dir##*/naga-}"
            mkdir -p "Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes/$rid/native"
            cp "$dir"/* "Core/YotsubaShader.Compiler.CLI/Native/naga/runtimes/$rid/native/"
          done
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - name: Datos del MCP (referencia de learn y ejemplos)
        uses: ./.github/actions/mcp-data
        with:
          token: ${{ secrets.WEB_REPO_TOKEN }}

      - name: Build example project for workspace smoke test
        shell: bash
        run: dotnet build Examples/YotsubaShader.Example/YotsubaShader.Example.csproj -c Release -p:CompileYotsubaShaders=false
      - name: Publish self-contained executable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          config = ET.Element('configuration')
          sources = ET.SubElement(config, 'packageSources')
          ET.SubElement(sources, 'clear')
          ET.SubElement(sources, 'add', key='local', value=str((Path.cwd() / 'nupkg').resolve()))
          ET.SubElement(sources, 'add', key='nuget.org', value='https://api.nuget.org/v3/index.json')
          ET.ElementTree(config).write('release.nuget.config', encoding='utf-8', xml_declaration=True)
          PY
          dotnet restore Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj \
            -r '${{ matrix.rid }}' -p:Version='${{ needs.validate.outputs.version }}' \
            -p:UseForkShadowDuskPackages=true \
            --configfile release.nuget.config
          dotnet publish Core/YotsubaShader.Compiler.CLI/YotsubaShader.Compiler.CLI.csproj \
            -c Release -r '${{ matrix.rid }}' --self-contained --no-restore \
            -o 'publish/${{ matrix.rid }}' \
            -p:Version='${{ needs.validate.outputs.version }}' \
            -p:UseForkShadowDuskPackages=true
          cp LICENSE NOTICE ThirdParty/ShadowDusk/src/ShadowDusk.HLSL/THIRD-PARTY-NOTICES.txt 'publish/${{ matrix.rid }}/'
          cp Core/ShaderCross/YotsubaShaderCross/LICENSE 'publish/${{ matrix.rid }}/LICENSE-YotsubaShaderCross'
      - name: Run outside checkout and verify all shader targets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/yotsuba-${{ matrix.rid }}"
          cp -R 'publish/${{ matrix.rid }}/.' "$RUNNER_TEMP/yotsuba-${{ matrix.rid }}/"
          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            exe="$RUNNER_TEMP/yotsuba-${{ matrix.rid }}/YotsubaShader.Compiler.CLI.exe"
          else
            exe="$RUNNER_TEMP/yotsuba-${{ matrix.rid }}/YotsubaShader.Compiler.CLI"
            chmod +x "$exe"
          fi
          python scripts/verify_release.py smoke "$exe" Examples/YotsubaShader.Example/YotsubaShader.Example.csproj
          python scripts/mcp_smoke.py "$exe" mcp
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'publish/${{ matrix.rid }}/*' -DestinationPath 'YotsubaShader-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.zip'
      - name: Archive Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -C 'publish/${{ matrix.rid }}' -czf 'YotsubaShader-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.tar.gz' .
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: YotsubaShader-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.*
          if-no-files-found: error

  # Yotsuba Shader Hub (Apps/YotsubaShader.Hub): the desktop installer, offline docs and playground. Its content does
  # not depend on the platform, so it is built once and every runner packs it with its own native Hub.
  hub-content:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Web repository (learn, site and playground sources)
        uses: ./.github/actions/mcp-data
        with:
          token: ${{ secrets.WEB_REPO_TOKEN }}
      - name: Native dependencies of the language projects the playground references
        run: bash ThirdParty/ShadowDusk/tools/restore.sh
      - name: Build the Hub interface, learn, the site and the playground
        run: bash scripts/hub/build_content.sh hub-content
      - uses: actions/upload-artifact@v4
        with:
          name: hub-content
          path: hub-content
          if-no-files-found: error

  publish-hub:
    needs: [validate, hub-content]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: win-x64, os: windows-2022}
          - {rid: win-arm64, os: windows-11-arm}
          - {rid: linux-x64, os: ubuntu-24.04}
          - {rid: linux-arm64, os: ubuntu-24.04-arm}
          - {rid: osx-x64, os: macos-15-intel}
          - {rid: osx-arm64, os: macos-15}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: hub-content
          path: hub-content
      - name: Velopack CLI (same version as the Velopack package of the Hub)
        shell: bash
        run: |
          dotnet tool install --global vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Publish, check and pack the Hub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/hub/pack.sh '${{ needs.validate.outputs.version }}' '${{ matrix.rid }}' hub-content hub-out
      - name: Check the package files of this platform
        shell: bash
        run: |
          test -f 'hub-out/releases.${{ matrix.rid }}.json'
          ls hub-out/*-'${{ matrix.rid }}'-full.nupkg
          ls hub-out/*-'${{ matrix.rid }}'-Setup.*
          # The Hub's Download button looks for exactly this name in the release.
          ls hub-out/Yotsuba-Shader-Hub-'${{ matrix.rid }}'.*
      - uses: actions/upload-artifact@v4
        with:
          name: hub-pkg-${{ matrix.rid }}
          path: hub-out/*
          if-no-files-found: error

  nuget-push:
    needs: [validate, pack, publish-cli]
    runs-on: ubuntu-24.04
    environment: nuget
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for package in Core HLSL GLSL Compiler; do
            dotnet nuget push "nupkg/YotsubaShader.ShadowDusk.$package.$VERSION.nupkg" \
              --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          for package in nupkg/*.nupkg; do
            [[ "$package" == nupkg/YotsubaShader.ShadowDusk.* ]] && continue
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in nupkg/*.nupkg; do
            dotnet nuget push "$package" --api-key "$GITHUB_TOKEN" \
              --source https://nuget.pkg.github.com/KMemphis/index.json --skip-duplicate
          done

  release-assets:
    needs: [validate, nuget-push]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: cli-artifacts
      - name: Attach all six archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(find cli-artifacts -type f | wc -l)
          test "$count" -eq 6
          find cli-artifacts -type f -print0 | while IFS= read -r -d '' archive; do
            gh release upload "$RELEASE_TAG" "$archive" --clobber
          done

  # The Hub installers are attached after the packages are on NuGet, because the Hub installs the compiler from there.
  # Velopack reads releases.<channel>.json to find updates, so the feeds go last: a half-uploaded release never
  # advertises a package that is not there yet.
  hub-release-assets:
    needs: [validate, nuget-push, publish-hub]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hub-pkg-*
          path: hub-artifacts
      - name: Attach the Hub packages of all six platforms
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            test -f "hub-artifacts/hub-pkg-$rid/releases.$rid.json"
            # Six installers in all (3 systems x 2 architectures), named Yotsuba-Shader-Hub-<rid>.<ext>.
            ls hub-artifacts/hub-pkg-$rid/Yotsuba-Shader-Hub-$rid.* > /dev/null
          done
          find hub-artifacts -type f ! -name 'releases.*.json' ! -name 'RELEASES-*' ! -name 'assets.*.json' -print0 |
            while IFS= read -r -d '' file; do gh release upload "$RELEASE_TAG" "$file" --clobber; done
          find hub-artifacts -type f \( -name 'releases.*.json' -o -name 'RELEASES-*' \) -print0 |
            while IFS= read -r -d '' file; do gh release upload "$RELEASE_TAG" "$file" --clobber; done
